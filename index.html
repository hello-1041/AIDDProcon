<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIDDProcon</title>
    <!-- ブロック崩し（block-kuzushi）専用のドット風フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <!-- TextAlive Player のメディア要素（音声再生・クレジットバナー表示先） -->
      <div id="media"></div>
      <!-- ブロック崩し（block-kuzushi）専用の第2のPlayerインスタンス用メディア要素。
           水切リズムの#mediaとはグローバルIDを分離し、独立して音声再生・バナー表示を行う。 -->
      <div id="bk-media"></div>
      <!-- 歌詞コンソール（lyric-console）専用の第3のPlayerインスタンス用メディア要素。
           他2作とグローバルIDを分離し、独立して音声再生・バナー表示を行う。 -->
      <div id="lc-media"></div>
      <!-- 単語探し（lyric-search）専用の第4のPlayerインスタンス用メディア要素。
           他3作とグローバルIDを分離し、独立して音声再生・バナー表示を行う。 -->
      <div id="ls-media"></div>

      <section id="screen-menu" class="screen screen--active">
        <h1 id="menu-logo">GAME MENU</h1>
        <p class="menu-desc">遊びたいゲームを選んでください</p>
        <ul class="game-list">
          <li>
            <button class="game-entry" data-game="mizuki-rhythm" disabled>
              <span class="game-entry-title">水切リズム</span>
            </button>
          </li>
          <li>
            <button class="game-entry" data-game="block-kuzushi" disabled>
              <span class="game-entry-title">ブロック崩し</span>
            </button>
          </li>
          <li>
            <button class="game-entry" data-game="lyric-console">
              <span class="game-entry-title">Lyric-Console</span>
            </button>
          </li>
          <li>
            <button class="game-entry" data-game="lyric-search">
              <span class="game-entry-title">Lyric-Search</span>
            </button>
          </li>
          <li>
            <button class="game-entry" disabled>
              <span class="game-entry-title">準備中...</span>
            </button>
          </li>
        </ul>
      </section>

      <div id="game-mizuki-rhythm" class="game-section">
        <section id="screen-title" class="screen">
          <h1 id="title-logo">MizukiRhythm</h1>
          <p class="title-desc">
            音楽のリズムに合わせてクリック！<br />
            石を遠くまで飛ばしてハイスコアを狙おう
          </p>
          <button id="btn-start" disabled>クリックしてスタート</button>
          <button id="btn-menu" class="btn-secondary">メニューに戻る</button>
        </section>

        <section id="screen-play" class="screen">
          <!-- 開発ビルドでのみ表示する楽曲再生位置のシークバー（main.tsが制御） -->
          <input type="range" id="debug-seek" class="debug-seek" min="0" max="0" value="0" step="1" />
          <div id="hud-best-label" class="hud hud-left">
            自己ベスト: <span id="hud-best">0m</span>
          </div>
          <div id="hud-current-label" class="hud hud-current">
            現在: <span id="hud-current">0m</span>
          </div>
          <button id="btn-pause" class="hud hud-pause">⏸ 一時停止</button>
          <canvas id="game-canvas"></canvas>
          <div id="judge-popup"></div>
          <!-- 開発ビルドでのみ表示するタイミング確認用デバッグ表示（main.tsが制御） -->
          <div id="debug-hud" class="debug-hud"></div>
        </section>

        <section id="screen-result" class="screen">
          <h1>結果発表</h1>
          <p id="result-score"></p>
          <div class="result-buttons">
            <button id="btn-retry">もう一度遊ぶ</button>
            <button id="btn-title">タイトルに戻る</button>
          </div>
        </section>
      </div>

      <div id="game-block-kuzushi" class="game-section">
        <section id="bk-screen-title" class="screen">
          <h1 id="bk-title-logo">ブロック崩し</h1>
          <p class="bk-title-desc">
            歌詞ブロックをボールで崩そう！<br />
            全部集めてクリアを目指せ
          </p>
          <button id="bk-btn-start" disabled>クリックしてスタート</button>
          <button id="bk-btn-menu" class="btn-secondary">メニューに戻る</button>
        </section>

        <section id="bk-screen-play" class="screen">
          <div class="bk-header">
            <span>取得率: <span id="bk-hud-score">0%</span></span>
            <span class="bk-header-next">次: <span id="bk-hud-next-word">-</span></span>
            <button id="bk-btn-pause">⏸ 一時停止</button>
          </div>
          <div class="bk-canvas-wrap">
            <canvas id="bk-canvas"></canvas>
          </div>
        </section>

        <section id="bk-screen-result" class="screen">
          <h1>結果発表</h1>
          <p id="bk-result-score"></p>
          <div id="bk-result-words" class="bk-result-words"></div>
          <div class="result-buttons">
            <button id="bk-btn-retry">もう一度遊ぶ</button>
            <button id="bk-btn-title">タイトルに戻る</button>
          </div>
        </section>
      </div>

      <div id="game-lyric-console" class="game-section">
        <section id="lc-screen-title" class="screen">
          <h1 id="lc-title-logo">Lyric-Console</h1>
          <!-- 説明文は削除済み。この要素自体はトークン未設定時のエラー表示欄として
               ui.ts の showTokenError から使い回すため、空のまま残す。 -->
          <p class="lc-title-desc"></p>

          <div class="lc-setting-group">
            <span class="lc-setting-label">Color</span>
            <div class="lc-option-buttons" data-lc-option="color">
              <button class="lc-option-btn" data-value="GREEN">GREEN</button>
              <button class="lc-option-btn" data-value="AMBER">AMBER</button>
              <button class="lc-option-btn" data-value="WHITE">WHITE</button>
            </div>
          </div>

          <div class="lc-setting-group">
            <span class="lc-setting-label">Song</span>
            <div class="lc-option-buttons" data-lc-option="song">
              <button class="lc-option-btn" data-index="0" disabled>こたえて</button>
              <button class="lc-option-btn" data-index="1" disabled>アフター・ザ・カーテン</button>
              <button class="lc-option-btn" data-index="2" disabled>シャッターチャンス</button>
              <button class="lc-option-btn" data-index="3" disabled>世界最後の音楽隊</button>
              <button class="lc-option-btn" data-index="4" disabled>トリツクロジー</button>
              <button class="lc-option-btn" data-index="5" disabled>TAKEOVER</button>
            </div>
          </div>

          <button id="lc-btn-start" disabled>[ START ]</button>
          <button id="lc-btn-menu" class="lc-btn-secondary">[ EXIT ]</button>
        </section>

        <section id="lc-screen-play" class="screen">
          <div class="lc-status-bar">
            <span id="lc-spinner" class="lc-spinner"></span>
            <div class="lc-status-readout">
              <span id="lc-progress" class="lc-progress"></span>
              <span id="lc-vocal-meter" class="lc-vocal-meter"
                ><span class="lc-vol-label">VOL </span><span id="lc-vocal-bar"></span
              ></span>
            </div>
          </div>
          <div id="lc-terminal-play" class="lc-terminal"></div>
          <!-- 開発用の再生位置シークバー・一時停止ボタン（DEV環境限定、index.tsが
               表示・配線を行う。本番ビルドではCSSの既定値display:noneのまま） -->
          <input
            type="range"
            id="lc-debug-seek"
            class="lc-debug-seek"
            min="0"
            max="0"
            value="0"
            step="1"
          />
          <button id="lc-debug-pause" class="lc-debug-pause">⏸ 一時停止</button>
        </section>

        <section id="lc-screen-result" class="screen">
          <div id="lc-terminal-result" class="lc-terminal"></div>
          <div id="lc-result-stats" class="lc-result-stats">
            <p>playtime: <span id="lc-stat-playtime"></span></p>
            <p>color: <span id="lc-stat-color"></span></p>
            <div class="result-buttons">
              <button id="lc-btn-retry">[ RETRY ]</button>
              <button id="lc-btn-title">[ TITLE ]</button>
            </div>
          </div>
        </section>
      </div>

      <div id="game-lyric-search" class="game-section">
        <section id="ls-screen-title" class="screen">
          <h1 id="ls-title-logo">Lyric-Search</h1>
          <!-- 説明文は削除済み（実装指摘1）。この要素自体はトークン未設定時の
               エラー表示欄として ui.showTokenError から使い回すため、空のまま残す
               （歌詞コンソールの .lc-title-desc と同じ扱い）。 -->
          <p class="ls-title-desc"></p>

          <div class="ls-setting-group">
            <label for="ls-song-select" class="ls-setting-label">Song</label>
            <!-- 選曲プルダウン（実装指摘10）。ネイティブの<select>とし、開いた一覧は
                 ブラウザ・OS標準のものを使う（スマートフォンでは端末のピッカーになる）。
                 valueでtextalive.SONGSの添字と直結させる（曲名文字列の属性エスケープを
                 避ける）。曲名・アーティスト名はSONGSと同じ順・同じ表記で並べること。 -->
            <select id="ls-song-select" class="ls-song-select" disabled>
              <option value="0">こたえて / imie</option>
              <option value="1">アフター・ザ・カーテン / Rulmry</option>
              <option value="2">シャッターチャンス / 夜未アガリ</option>
              <option value="3">世界最後の音楽隊 / 夏山よつぎ×ど～ぱみん</option>
              <option value="4">トリツクロジー / 鶴三</option>
              <option value="5">TAKEOVER / Twinfield</option>
            </select>
          </div>

          <button id="ls-btn-start" disabled>START</button>
          <button id="ls-btn-menu" class="ls-btn-secondary">EXIT</button>
        </section>

        <section id="ls-screen-play" class="screen">
          <!-- 歌詞ガイド（製造計画書4.1）。演出ではなく必須の機能であり、
               表示中フレーズの語チップをここに出す。高さは固定（4.5）。 -->
          <div id="ls-guide" class="ls-guide"></div>

          <!-- 盤面。グリッド（DOM）と選択経路（SVG）を重ねる（4.2）。 -->
          <div class="ls-board-wrap">
            <div id="ls-board" class="ls-board"></div>
            <!-- 経路線はセル中心のピクセル座標で直接描くため、viewBoxは持たせない
                 （viewBox座標系にするとstroke-widthが盤面サイズに応じて化ける）。 -->
            <svg id="ls-path" class="ls-path" aria-hidden="true"></svg>
          </div>

          <div class="ls-status">
            <span class="ls-status-item">取得率: <span id="ls-hud-score">0%</span></span>
            <span class="ls-status-item" id="ls-hud-time">0:00 / 0:00</span>
            <button id="ls-btn-pause" class="ls-btn-pause">⏸ 一時停止</button>
          </div>

          <!-- 開発用（DEV環境限定、index.tsが表示・配線を行う。本番ビルドでは
               CSSの既定値display:noneのまま）。シークバーは9章の暫定パラメータ
               調整に、選択モードトグルは11.4の実機比較に使う。 -->
          <div id="ls-debug" class="ls-debug">
            <input
              type="range"
              id="ls-debug-seek"
              class="ls-debug-seek"
              min="0"
              max="0"
              value="0"
              step="1"
            />
            <button id="ls-debug-mode" class="ls-debug-mode">選択: 経路</button>
          </div>
        </section>

        <section id="ls-screen-result" class="screen">
          <h2 class="ls-result-title">RESULT</h2>
          <p id="ls-result-score" class="ls-result-score">0%</p>
          <div id="ls-result-words" class="ls-result-words"></div>
          <div class="result-buttons">
            <button id="ls-btn-retry">RETRY</button>
            <button id="ls-btn-title">TITLE</button>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
